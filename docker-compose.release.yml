# 使用预构建镜像部署（无需自己构建）
#
# 用法：
#   1. 在同目录创建 .env：
#        SQL_DSN=oneapi:强密码@tcp(db:3306)/one-api
#        MYSQL_ROOT_PASSWORD=<强密码>
#        MYSQL_PASSWORD=<强密码>
#        SESSION_SECRET=$(openssl rand -hex 32)
#        USER_TOKEN_SECRET=$(openssl rand -hex 32)
#   2. docker compose -f docker-compose.release.yml up -d
#   3. 浏览器打开 http://<服务器IP>:3000，管理员账号 root，初始密码在首次启动日志里：
#        docker compose -f docker-compose.release.yml logs one-hub | grep 初始密码
#      登录后立刻修改密码
#
# 镜像同时提供 amd64 / arm64，群晖、树莓派等 arm64 设备可直接拉取。
version: "3.4"

services:
  one-hub:
    image: ghcr.io/addy163/one-hub:latest
    container_name: one-hub
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - SQL_DSN=${SQL_DSN:?请在 .env 中配置 SQL_DSN}
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=${SESSION_SECRET:?请在 .env 中配置 32 位以上随机串}
      - USER_TOKEN_SECRET=${USER_TOKEN_SECRET:?请在 .env 中配置 32 位以上随机串}
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
      - db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $$2}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: one-hub-redis
    restart: always
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.2.0
    restart: always
    container_name: one-hub-mysql
    volumes:
      - ./data/mysql:/var/lib/mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置}
      MYSQL_USER: ${MYSQL_USER:-oneapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-one-api}
    security_opt:
      - no-new-privileges:true
