# 安全提示：
# 1. 使用前在同目录创建 .env，写入 SQL_DSN / SESSION_SECRET / USER_TOKEN_SECRET /
#    MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD。未设置时 compose 会直接拒绝启动，
#    避免把 random_string / 123456 之类的弱凭据带到生产环境。
# 2. SESSION_SECRET、USER_TOKEN_SECRET 请使用 32 位以上随机串：
#    openssl rand -hex 32
# 3. 数据库端口不再映射到宿主机；如需临时维护请自行用 docker exec 进入容器。
version: "3.4"

services:
  one-hub:
    # 固定 tag，避免 latest 不可复现；先执行：docker build -t one-hub:local .
    image: one-hub:local
    container_name: one-hub
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - SQL_DSN=${SQL_DSN:?请在 .env 中配置 SQL_DSN}
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=${SESSION_SECRET:?请在 .env 中配置 32 位以上随机串}
      - USER_TOKEN_SECRET=${USER_TOKEN_SECRET:?请在 .env 中配置 32 位以上随机串}
      - TZ=Asia/Shanghai
      # - HASHIDS_SALT=${HASHIDS_SALT} # 可空，建议设置，字符串元素不能重复
    security_opt:
      - no-new-privileges:true
    #      - NODE_TYPE=slave  # 多机部署时从节点取消注释该行
    #      - SYNC_FREQUENCY=60  # 需要定期从数据库加载数据时取消注释该行
    #      - FRONTEND_BASE_URL=https://openai.justsong.cn  # 多机部署时从节点取消注释该行
    depends_on:
      - redis
      - db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' | awk -F: '{print $$2}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.2.0
    restart: always
    container_name: mysql
    volumes:
      - ./data/mysql:/var/lib/mysql # 挂载目录，持久化存储
    # 数据库不暴露到宿主机，仅容器网络内可访问
    # ports:
    #   - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置}
      MYSQL_USER: ${MYSQL_USER:-oneapi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-one-api}
    security_opt:
      - no-new-privileges:true
