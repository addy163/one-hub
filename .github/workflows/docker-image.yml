name: Publish Docker image (ghcr.io)

# 打 tag（v*）时自动构建多架构镜像并推送到 GitHub Container Registry；
# 也可以在 Actions 页面手动触发，版本号留空时用 dev-<commit> 作为镜像内版本。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像内显示的版本号，例如 v0.9.2（留空则用 dev-<commit>）"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 写入版本号
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "${{ inputs.version }}" > VERSION
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "${GITHUB_REF_NAME}" > VERSION
          else
            echo "dev-$(git rev-parse --short=7 HEAD)" > VERSION
          fi
          echo "VERSION=$(cat VERSION)"

      # arm64 镜像的 apk 安装仍需要模拟；Go 侧已改成纯交叉编译，不受影响。
      - name: 准备 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=one-hub
            org.opencontainers.image.description=One Hub - LLM API gateway with usage billing
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: 构建并推送（amd64 / arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
